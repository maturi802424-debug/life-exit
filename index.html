<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>人生の出口 | LIFE EXIT</title><link rel="stylesheet" href="style.css"></head><body><div id="game"></div><div id="vignette"></div><div id="flash"></div><div id="hud"><div class="brand">LIFE EXIT <small>人生の出口</small></div><div id="level">現在地 <b>0</b> / 8</div></div><div id="crosshair">＋</div><div id="poster"><span id="theme">現在地</span><strong id="message">出口は、進んだ先にあるとは限らない。</strong></div><div id="decision" class="hidden"><p>この通路に「異変」はありましたか？</p><button id="back">↩ 異変あり・引き返す</button><button id="forward">進む・異変なし →</button></div><div id="start"><div class="panel"><p class="eyebrow">A SELF-AWARENESS EXPERIENCE</p><h1>人生の出口</h1><p>同じように見える通路を進み、人生に潜む小さな「異変」に気づいてください。</p><div class="rules">異変を感じたら引き返す。<br>異変がなければ進む。<br>8つの扉の先に、あなたの出口があります。</div><button id="startBtn">通路へ入る</button><small>🎧 音が出ます　PC: WASD / クリック　スマホ: 画面下ボタン</small></div></div><div id="ending" class="hidden"><div class="panel"><p class="eyebrow">EXIT 8</p><h1>出口は、<br>ずっとそこにあった。</h1><p>必要だったのは、<br><strong>「異変に気づくこと」</strong>だった。</p><div id="reflection"></div><button id="again">もう一度歩く</button></div></div><div id="mobile"><button id="left">←</button><button id="walk">↑ 進む</button><button id="right">→</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module" src="app.js"></script></body></html>
